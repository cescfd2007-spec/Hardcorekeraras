name: Compilar plugin
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: HardcoreWorldReset
          path: target/hardcore-world-reset-1.0.1.jar
